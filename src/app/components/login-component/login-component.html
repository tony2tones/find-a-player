<div class="min-h-screen flex items-center justify-center px-4">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 w-full max-w-sm bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-semibold text-center">Log in</h2>

    <div class="flex flex-col gap-1">
      <label for="email" class="text-sm font-medium text-gray-700">Email</label>
      <input
        id="email"
        type="text"
        formControlName="email"
        required="true"
        placeholder="Enter email"
        class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        [attr.aria-describedby]="loginForm.controls['email'].invalid ? 'email-error' : null"
        [attr.aria-invalid]="loginForm.controls['email'].invalid"
      />
      @if (!loginForm.controls['email'].valid && loginForm.controls['email'].dirty) {
        <p id="email-error" class="text-sm text-red-600">Please enter a valid email.</p>
      }
    </div>

    <div class="flex flex-col gap-1">
      <label for="password" class="text-sm font-medium text-gray-700">Password</label>
      <input
        id="password"
        type="password"
        required
        formControlName="password"
        placeholder="Enter a valid password"
        class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        [attr.aria-describedby]="loginForm.controls['password'].invalid ? 'password-error' : null"
        [attr.aria-invalid]="loginForm.controls['password'].invalid"
      />
      @if (!loginForm.controls['password'].valid && loginForm.controls['password'].dirty) {
        <p id="password-error" class="text-sm text-red-600">Please enter a valid password.</p>
      }
    </div>

    <button 
      type="submit" 
      [disabled]="!loginForm.valid"
      class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md py-2 mt-2 cursor-pointer transition-colors disabled:bg-blue-300"
      >Submit</button>
  </form>
</div>
