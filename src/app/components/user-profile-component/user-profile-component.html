<div class="max-w-md mx-auto p-4">
    <form [formGroup]="profileForm" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label for="name" class="text-sm font-medium text-gray-700">Name</label>
        <input id="name" formControlName="name" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
      </div>

      <div class="flex flex-col gap-1">
        <label for="last_name" class="text-sm font-medium text-gray-700">Last name</label>
        <input id="last_name" formControlName="last_name" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
      </div>

      <div class="flex flex-col gap-1">
        <label for="age" class="text-sm font-medium text-gray-700">Age</label>
        <input id="age" formControlName="age" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
      </div>

      <fieldset formGroupName="location" class="border border-gray-200 rounded-md p-3 flex flex-col gap-3">
        <legend class="text-sm font-medium text-gray-700 px-1">Location</legend>
        <div class="flex flex-col gap-1">
          <label for="city" class="text-sm font-medium text-gray-700">City</label>
          <input id="city" formControlName="city" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div class="flex flex-col gap-1">
          <label for="country" class="text-sm font-medium text-gray-700">Country</label>
          <input id="country" formControlName="country" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
      </fieldset>

      <fieldset formGroupName="skill_level" class="border border-gray-200 rounded-md p-3 flex flex-col gap-3">
        <legend class="text-sm font-medium text-gray-700 px-1">Skill level</legend>
        <div class="flex flex-col gap-1">
          <label for="overall" class="text-sm font-medium text-gray-700">Overall</label>
          <input id="overall" type="number" formControlName="overall" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
      </fieldset>

      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md py-2 mt-2 cursor-pointer transition-colors">Submit</button>
    </form>
</div>
