<div class="min-h-screen flex items-center justify-center px-4">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 w-full max-w-sm bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-semibold text-center">Sign up</h2>

    <div class="flex flex-col gap-1">
      <label for="email" class="text-sm font-medium text-gray-700">Email</label>
      <input id="email" type="text" formControlName="email" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
    </div>

    <div class="flex flex-col gap-1">
      <label for="password" class="text-sm font-medium text-gray-700">Password</label>
      <input id="password" type="password" formControlName="password" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
    </div>

    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md py-2 mt-2 cursor-pointer transition-colors">
      Submit
    </button>
  </form>
</div>
