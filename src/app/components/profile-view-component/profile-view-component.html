<div class="max-w-md mx-auto p-4 border border-gray-200 rounded-md flex flex-col gap-3">
  <div class="flex items-start justify-between gap-2">
    <div>
      <h2 class="text-lg font-semibold text-gray-900">{{ profile?.name }} {{ profile?.last_name }}</h2>
      <p class="text-sm text-gray-500">Age: {{ profile?.age }}</p>
    </div>
    <button
      type="button"
      (click)="onEditClick()"
      class="text-sm font-medium text-blue-600 hover:text-blue-700 hover:cursor-pointer"
    >
      Edit
    </button>
  </div>

  <p class="text-sm text-gray-700">{{ profile?.location?.city }}, {{ profile?.location?.country }}</p>

  <div class="flex items-center gap-2">
    <span class="text-sm font-medium text-gray-700">Skill level</span>
    <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-blue-500 text-white text-sm font-semibold">
      {{ profile?.skill_level?.overall }}
    </span>
  </div>
</div>
